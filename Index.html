<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>GreenFi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }


    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: sans-serif;
    }


    .slider-container {
      display: flex;
      width: 200%;
      height: 100%;
      transition: transform 0.28s ease-out;
    }


    .page {
      position: relative;
      width: 50%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      background-color: #121212;
    }


    .page img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }


    /* Invisible clickable area over the Checking balance row on Page 1 */
    .hotspot-checking {
      position: absolute;
      top: 33%;
      left: 0;
      width: 100%;
      height: 8%;
      cursor: pointer;
      z-index: 10;
    }


    /* Invisible clickable area over the top back button on Page 2 */
    .hotspot-back {
      position: absolute;
      top: 6%;
      left: 2%;
      width: 18%;
      height: 6%;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>


  <div class="slider-container" id="slider">
    <!-- Page 1: Home Screen -->
    <div class="page" id="page1">
      <img src="screen1.png" alt="Home Screen">
      <div class="hotspot-checking" id="checkingHotspot"></div>
    </div>


    <!-- Page 2: Checking Activity Screen -->
    <div class="page" id="page2">
      <img src="screen2.png" alt="Checking Activity">
      <div class="hotspot-back" id="backHotspot"></div>
    </div>
  </div>


  <script>
    const slider = document.getElementById('slider');
    const checkingBtn = document.getElementById('checkingHotspot');
    const backBtn = document.getElementById('backHotspot');


    let currentPage = 0;
    let startX = 0;
    let currentX = 0;
    let isTouching = false;


    function goToPage(pageIndex) {
      currentPage = pageIndex;
      slider.style.transform = `translateX(-${currentPage * 50}%)`;
    }


    checkingBtn.addEventListener('click', () => {
      goToPage(1);
    });


    backBtn.addEventListener('click', () => {
      goToPage(0);
    });


    window.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      currentX = startX;
      isTouching = true;
    });


    window.addEventListener('touchmove', (e) => {
      if (!isTouching) return;
      currentX = e.touches[0].clientX;
    });


    window.addEventListener('touchend', () => {
      if (!isTouching) return;
      isTouching = false;
      const difference = startX - currentX;


      // Swipe left to go to Checking Activity
      if (difference > 50 && currentPage === 0) {
        goToPage(1);
      }
      // Swipe right to go back to Home
      else if (difference < -50 && currentPage === 1) {
        goToPage(0);
      }
    });
  </script>
</body>
</html>
